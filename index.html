<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SWILL TEST</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="background:#1a1a2e;color:white;padding:20px;font-family:sans-serif;">
    <h1>🦅 SWILL TEST</h1>
    <input type="text" id="target" placeholder="@username" style="padding:10px;width:100%;margin:10px 0;background:#0f3460;color:white;border:none;border-radius:8px;">
    <select id="reason" style="padding:10px;width:100%;margin:10px 0;background:#0f3460;color:white;border:none;border-radius:8px;">
        <option value="spam">📧 Спам</option>
        <option value="scam">💀 Мошенничество</option>
        <option value="impersonation">🎭 Выдача за другого</option>
    </select>
    <button onclick="send()" style="padding:15px;width:100%;background:#e94560;color:white;border:none;border-radius:8px;font-size:16px;">🚀 Отправить</button>
    <div id="log" style="margin-top:15px;font-size:13px;"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        function send() {
            const target = document.getElementById('target').value.trim();
            const reason = document.getElementById('reason').value;
            
            if (!target) {
                alert('Введи @username');
                return;
            }
            
            const data = JSON.stringify({
                action: 'complaint',
                target: target.replace('@', ''),
                reason: reason
            });
            
            document.getElementById('log').innerHTML += '<p>📤 Отправляю: ' + data + '</p>';
            
            tg.sendData(data);
            
            document.getElementById('log').innerHTML += '<p>✅ Данные отправлены в бота</p>';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SWILL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--tg-bg-color,#1a1a2e);color:var(--tg-text-color,#fff);padding:12px}
        .btn{width:100%;padding:14px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;color:#fff}
        .btn-red{background:#e94560}
        .btn-blue{background:#0f3460}
        .btn-green{background:#16c79a}
        .btn-gray{background:#333}
        input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #333;border-radius:10px;background:#16213e;color:#fff;font-size:15px}
        .hidden{display:none}
        .log{background:#16213e;border-radius:10px;padding:10px;margin-top:10px;font-size:12px;max-height:150px;overflow-y:auto}
        .log-item{padding:3px 0;border-bottom:1px solid #1a1a2e}
    </style>
</head>
<body>
    <div id="main">
        <button class="btn btn-red" onclick="show('complaint')">🎯 Подать жалобу</button>
        <button class="btn btn-blue" onclick="show('track')">📋 Отследить</button>
        <button class="btn btn-green" onclick="send('!купить')">💳 Купить Stars</button>
        <button class="btn btn-gray" onclick="send('!статус')">🔄 Обновить</button>
    </div>

    <div id="complaint" class="hidden">
        <button class="btn btn-gray" onclick="show('main')">◀️ Назад</button>
        <h3 style="color:#e94560;margin:10px 0">🎯 Новая жалоба</h3>
        <input type="text" id="target" placeholder="@username">
        <select id="reason">
            <option value="spam">📧 Спам</option>
            <option value="scam">💀 Мошенничество</option>
            <option value="impersonation">🎭 Выдача за другого</option>
            <option value="harassment">😡 Преследование</option>
            <option value="illegal_content">🔞 Запрещённый контент</option>
            <option value="bot_account">🤖 Бот/Фейк</option>
        </select>
        <button class="btn btn-red" onclick="submitComplaint()">🚀 Отправить</button>
        <div class="log" id="complaintLog"></div>
    </div>

    <div id="track" class="hidden">
        <button class="btn btn-gray" onclick="show('main')">◀️ Назад</button>
        <h3 style="color:#e94560;margin:10px 0">📋 Отследить</h3>
        <input type="text" id="searchUser" placeholder="@username">
        <button class="btn btn-blue" onclick="search()">🔍 Поиск</button>
        <div class="log" id="searchLog"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function show(id) {
            document.querySelectorAll('#main,#complaint,#track').forEach(el => el.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        async function send(text) {
            // Отправляем через HTTP API (работает всегда)
            const BOT_TOKEN = "8841992645:AAE7H9JlWULnxaGg4GE41p7vCivbRJ4jG5Q";
            const user = tg.initDataUnsafe?.user;
            if (!user) { tg.showAlert('Ошибка: нет данных пользователя'); return; }
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ chat_id: user.id, text: text })
                });
            } catch(e) {
                tg.showAlert('Ошибка отправки');
            }
        }

        function submitComplaint() {
            const target = document.getElementById('target').value.trim();
            const reason = document.getElementById('reason').value;
            if (!target) { tg.showAlert('Введите @username'); return; }
            
            const username = target.replace('@', '');
            document.getElementById('complaintLog').innerHTML += `<div class="log-item">🔄 @${username}...</div>`;
            send(`!жалоба ${username} ${reason}`);
            document.getElementById('complaintLog').innerHTML += `<div class="log-item">✅ Отправлено!</div>`;
            document.getElementById('target').value = '';
        }

        function search() {
            const username = document.getElementById('searchUser').value.trim();
            if (!username) { tg.showAlert('Введите @username'); return; }
            
            document.getElementById('searchLog').innerHTML += `<div class="log-item">🔍 @${username.replace('@','')}...</div>`;
            send(`!поиск ${username.replace('@','')}`);
            document.getElementById('searchUser').value = '';
        }
    </script>
</body>
</html>

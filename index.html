<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SWILL BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
        .header { text-align: center; padding: 15px; background: #16213e; border-radius: 12px; margin-bottom: 16px; border: 1px solid #e94560; }
        .header h1 { font-size: 24px; color: #e94560; }
        .btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; }
        .btn-primary { background: #e94560; }
        .btn-info { background: #0f3460; }
        .btn-success { background: #16c79a; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #0f3460; border-radius: 10px; background: #16213e; color: white; font-size: 15px; }
        .hidden { display: none; }
        .log { background: #16213e; border-radius: 10px; padding: 12px; margin-top: 12px; font-size: 13px; }
        .log-item { padding: 4px 0; border-bottom: 1px solid #0f3460; }
        .back-btn { background: transparent; border: 1px solid #aaa; color: #aaa; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="header"><h1>🦅 SWILL BOT</h1></div>

    <div id="mainMenu">
        <button class="btn btn-primary" onclick="showSection('complaint')">🎯 Подать жалобу</button>
        <button class="btn btn-info" onclick="showSection('track')">📋 Отследить</button>
        <button class="btn btn-success" onclick="sendCmd('!купить')">💳 Купить Stars</button>
        <button class="btn btn-info" onclick="sendCmd('!статус')">🔄 Обновить</button>
    </div>

    <div id="complaintSection" class="hidden">
        <button class="back-btn" onclick="showSection('main')">◀️ Назад</button>
        <h2 style="color:#e94560;margin-bottom:12px;">🎯 Новая жалоба</h2>
        <input type="text" id="targetUsername" placeholder="@username цели">
        <select id="reason">
            <option value="spam">📧 Спам</option>
            <option value="scam">💀 Мошенничество</option>
            <option value="impersonation">🎭 Выдача за другого</option>
            <option value="harassment">😡 Преследование</option>
            <option value="illegal_content">🔞 Запрещённый контент</option>
            <option value="bot_account">🤖 Бот/Фейк</option>
        </select>
        <button class="btn btn-primary" onclick="submitComplaint()">🚀 Отправить</button>
        <div class="log" id="complaintLog"></div>
    </div>

    <div id="trackSection" class="hidden">
        <button class="back-btn" onclick="showSection('main')">◀️ Назад</button>
        <h2 style="color:#e94560;margin-bottom:12px;">📋 Отследить</h2>
        <input type="text" id="searchUsername" placeholder="@username для поиска">
        <button class="btn btn-info" onclick="searchUser()">🔍 Поиск</button>
        <div class="log" id="searchLog"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function showSection(s) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('complaintSection').classList.add('hidden');
            document.getElementById('trackSection').classList.add('hidden');
            if (s === 'main') document.getElementById('mainMenu').classList.remove('hidden');
            if (s === 'complaint') document.getElementById('complaintSection').classList.remove('hidden');
            if (s === 'track') document.getElementById('trackSection').classList.remove('hidden');
        }

        function sendCmd(text) {
            // Используем sendData для отправки в бота
            tg.sendData(JSON.stringify({ text: text }));
        }

        function submitComplaint() {
            const target = document.getElementById('targetUsername').value.trim();
            const reason = document.getElementById('reason').value;
            if (!target) { tg.showAlert('Введите @username цели'); return; }
            
            const username = target.replace('@', '');
            const log = document.getElementById('complaintLog');
            log.innerHTML += `<div class="log-item">🔄 Отправляю жалобу на @${username}...</div>`;
            
            sendCmd(`!жалоба ${username} ${reason}`);
            log.innerHTML += `<div class="log-item">✅ Команда отправлена в бота</div>`;
            document.getElementById('targetUsername').value = '';
        }

        function searchUser() {
            const username = document.getElementById('searchUsername').value.trim();
            if (!username) { tg.showAlert('Введите @username'); return; }
            
            const log = document.getElementById('searchLog');
            log.innerHTML += `<div class="log-item">🔍 Ищу @${username.replace('@','')}...</div>`;
            
            sendCmd(`!поиск ${username.replace('@','')}`);
            document.getElementById('searchUsername').value = '';
        }

        tg.MainButton.setText('🔄 ОБНОВИТЬ').show().onClick(function() {
            sendCmd('!статус');
        });
    </script>
</body>
</html>

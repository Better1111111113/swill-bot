<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWILL BOT</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 16px;
        }
        .header {
            text-align: center;
            padding: 10px;
            background: #16213e;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 22px; color: #e94560; }
        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f3460;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .stat-item { text-align: center; }
        .stat-item .icon { font-size: 24px; }
        .stat-item .value { font-size: 18px; font-weight: bold; color: #16c79a; }
        .stat-item .label { font-size: 11px; color: #aaa; }
        .btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-primary { background: #e94560; }
        .btn-success { background: #16c79a; }
        .btn-warning { background: #f0a500; }
        .btn-info { background: #0f3460; }
        .log {
            background: #16213e;
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 13px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px solid #0f3460; }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #0f3460;
            border-radius: 10px;
            background: #16213e;
            color: white;
            font-size: 15px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦅 SWILL BOT</h1>
    </div>

    <div class="stats" id="stats">
        <div class="stat-item">
            <div class="icon">🟢</div>
            <div class="value" id="accOnline">-</div>
            <div class="label">Аккаунтов</div>
        </div>
        <div class="stat-item">
            <div class="icon">⚡</div>
            <div class="value" id="reportsPer">-</div>
            <div class="label">Жалоб/заказ</div>
        </div>
        <div class="stat-item">
            <div class="icon">💰</div>
            <div class="value" id="balance">-</div>
            <div class="label">Баланс</div>
        </div>
    </div>

    <div id="mainMenu">
        <button class="btn btn-primary" onclick="showSection('complaint')">🎯 Подать жалобу</button>
        <button class="btn btn-info" onclick="showSection('track')">📋 Отследить</button>
        <button class="btn btn-success" onclick="buyStars()">💳 Купить Stars</button>
        <button class="btn btn-warning" onclick="tg.openTelegramLink('https://t.me/your_bot')">📞 Поддержка</button>
    </div>

    <div id="complaintSection" class="hidden">
        <h3>🎯 Новая жалоба</h3>
        <input type="text" id="targetUsername" placeholder="@username цели">
        <select id="reason">
            <option value="spam">📧 Спам</option>
            <option value="scam">💀 Мошенничество</option>
            <option value="impersonation">🎭 Выдача за другого</option>
            <option value="harassment">😡 Преследование</option>
            <option value="illegal_content">🔞 Запрещённый контент</option>
            <option value="bot_account">🤖 Бот/Фейк</option>
        </select>
        <button class="btn btn-primary" onclick="sendComplaint()">🚀 Отправить</button>
        <button class="btn btn-info" onclick="showSection('main')">◀️ Назад</button>
        <div class="log" id="complaintLog"></div>
    </div>

    <div id="trackSection" class="hidden">
        <h3>📋 Отследить</h3>
        <input type="text" id="searchUsername" placeholder="@username для поиска">
        <button class="btn btn-info" onclick="searchUser()">🔍 Поиск</button>
        <button class="btn btn-info" onclick="showSection('main')">◀️ Назад</button>
        <div class="log" id="searchResult"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        function showSection(section) {
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('complaintSection').classList.add('hidden');
            document.getElementById('trackSection').classList.add('hidden');
            
            if (section === 'main') document.getElementById('mainMenu').classList.remove('hidden');
            if (section === 'complaint') document.getElementById('complaintSection').classList.remove('hidden');
            if (section === 'track') document.getElementById('trackSection').classList.remove('hidden');
        }

        function sendComplaint() {
            const target = document.getElementById('targetUsername').value.trim();
            const reason = document.getElementById('reason').value;
            
            if (!target) {
                alert('Введите @username цели');
                return;
            }

            const log = document.getElementById('complaintLog');
            log.innerHTML += `<div class="log-item">🔄 Отправка жалобы на ${target}...</div>`;
            
            tg.sendData(JSON.stringify({
                action: 'complaint',
                target: target.replace('@', ''),
                reason: reason
            }));
            
            document.getElementById('targetUsername').value = '';
        }

        function searchUser() {
            const username = document.getElementById('searchUsername').value.trim();
            if (!username) {
                alert('Введите @username');
                return;
            }
            
            tg.sendData(JSON.stringify({
                action: 'search',
                username: username.replace('@', '')
            }));
        }

        function buyStars() {
            tg.sendData(JSON.stringify({
                action: 'buy_stars'
            }));
        }

        tg.onEvent('mainButtonClicked', function() {
            tg.sendData(JSON.stringify({action: 'ready'}));
        });

        tg.MainButton.setText('ОБНОВИТЬ').show();
        tg.sendData(JSON.stringify({action: 'get_stats'}));
    </script>
</body>
</html>
